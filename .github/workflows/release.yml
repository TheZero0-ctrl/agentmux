name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Linux x86_64 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="agentmux-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "dist/${archive}" agentmux
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
